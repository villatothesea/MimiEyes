# hz: MimiEyes — the app ships as `mimieyes` (VENDORED.md #1).
[package]
name = "mimieyes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mimieyes"
path = "src/main.rs"

[dependencies]
zeron-engine.workspace = true
zeron-rpc.workspace = true
zeron-ui.workspace = true
zeron-update.workspace = true
zeron-mcp.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.dependencies]
# hz: + Threading / SystemInformation / WindowsProgramming for the activity
# monitor (`hz_monitor.rs`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0.11"
